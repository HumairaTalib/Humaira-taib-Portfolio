<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New_Card</title>
    <link rel="stylesheet" href="morrison.css">
</head>

<body>
    <div class="container">
        <div class="img"> <img src="images/morrison.jpg" height="230px"></div>
        <div class="text_wrapper">

            <div>
                <h1> Alex Morrison</h1>
                <div class="Name gray_text">Senior Journalist</div>
            </div>

            <div class="info">

                <div class="report gray_text">
                    <div>Articles</div>
                    <div>Followers</div>
                    <div>Rating</div>
                </div>

                <div class="numbers">
                    <div>34</div>
                    <div>980</div>
                    <div>8.9</div>
                </div>

            </div>

            <div class="command">
                <div class=" btn gray_text chat">Chat</div>
                <div class="btn gray_text follow">Follow</div>

            </div>
        </div>

    </div>
</body>

</html>
